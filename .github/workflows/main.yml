name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 25.2
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"

      - name: Fix Mac Path to Linux & Set Permissions
        run: |
          chmod +x gradlew
          chmod +x build_ffmpeg_android.sh
          sed -i 's/darwin-x86_64/linux-x86_64/g' build_ffmpeg_android.sh

      - name: Build FFmpeg Native Libraries
        run: |
          ./build_ffmpeg_android.sh $ANDROID_HOME/ndk/25.2.9519653

      - name: Build APK via Gradle
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: untrunc-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
