name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nsetup/setup-android-ndk@v1
        with:
          ndk-version: r27b

      - name: Grant execute permission for gradlew and build script
        run: |
          chmod +x gradlew
          chmod +x build_ffmpeg_android.sh

      - name: Build FFmpeg Libraries
        run: ./build_ffmpeg_android.sh $ANDROID_NDK_HOME

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: untrunc-android-apk
          path: app/build/outputs/apk/debug/app-debug.apk
